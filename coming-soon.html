<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon — AquaFix Plumbing</title>
  <meta name="description" content="Something exciting is coming from AquaFix Plumbing. Be the first to know!">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" sizes="184x184" href="favicon.svg">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/utility.css">
</head>

<body>
  <div class="page-controls">
    <button class="icon-btn rtl-text-btn" id="rtl-toggle" aria-label="Toggle RTL">RTL</button>
    <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode"><i class="bi bi-moon"></i></button>
  </div>
  <div class="coming-soon-page">
    <div class="coming-soon-content">
      <a href="index.html" class="cs-logo">
        <span class="logo-icon"><i class="bi bi-droplet"></i></span>
        <span class="brand-name"><span class="brand-aqua">Aqua</span><span class="brand-fix">Fix</span></span>
      </a>

      <h1><span class="text-gradient">Coming Soon</span></h1>
      <p>We're working on something amazing. Our new online booking platform is almost ready. Stay tuned!</p>

      <div class="countdown" id="countdown">
        <div class="countdown-item">
          <div class="num" id="cd-days">00</div>
          <div class="label">Days</div>
        </div>
        <div class="countdown-item">
          <div class="num" id="cd-hours">00</div>
          <div class="label">Hours</div>
        </div>
        <div class="countdown-item">
          <div class="num" id="cd-minutes">00</div>
          <div class="label">Minutes</div>
        </div>
        <div class="countdown-item">
          <div class="num" id="cd-seconds">00</div>
          <div class="label">Seconds</div>
        </div>
      </div>

      <form class="cs-notify" onsubmit="event.preventDefault();">
        <input type="email" placeholder="Enter your email for updates" required aria-label="Email for updates">
        <button type="submit">Notify Me</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setupThemeToggle();
      setupRtlToggle();
      const target = new Date();
      target.setDate(target.getDate() + 30);
      function updateCountdown() {
        const now = new Date();
        const diff = target - now;
        if (diff <= 0) return;
        const days = Math.floor(diff / 86400000);
        const hours = Math.floor((diff % 86400000) / 3600000);
        const minutes = Math.floor((diff % 3600000) / 60000);
        const seconds = Math.floor((diff % 60000) / 1000);
        document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
        document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
        document.getElementById('cd-minutes').textContent = String(minutes).padStart(2, '0');
        document.getElementById('cd-seconds').textContent = String(seconds).padStart(2, '0');
      }
      updateCountdown();
      setInterval(updateCountdown, 1000);
    });
  </script>
</body>

</html>
