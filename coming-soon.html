<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1d83f5" />
  <title>Coming Soon | AquaFix Premium</title>
  <meta name="description" content="Something premium is coming from AquaFix Plumbing. Subscribe to be the first to know." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="auth-page" style="text-align:center">
    <div class="auth-bg"></div>
    <div class="auth-top-actions">
      <button class="icon-btn" id="rtlToggle" aria-label="Toggle RTL"></button>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode"></button>
    </div>
    <div style="position:relative;z-index:1;max-width:36rem;padding:2rem">
      <a href="index.html" class="auth-logo mx-auto" style="margin:0 auto"><i class="bi bi-droplet-half"></i></a>
      <span class="eyebrow" style="margin-top:2rem"><i class="bi bi-stars"></i> Coming soon</span>
      <h1 style="font-family:var(--font-display);font-size:clamp(2rem,5vw,3rem);font-weight:800;margin-top:1rem">Something premium is coming</h1>
      <p class="muted" style="margin-top:1rem;font-size:1rem">We are launching AquaFix Premium — a white-glove plumbing service for Hyderabad's finest homes. Be the first to know when we go live.</p>

      <!-- Countdown -->
      <div id="countdown" data-target="2026-12-31T00:00:00" style="display:flex;justify-content:center;gap:1rem;margin-top:2.5rem">
        <div class="card-soft" style="padding:1.5rem 1.25rem;min-width:5rem"><div id="cd-days" style="font-family:var(--font-display);font-size:2rem;font-weight:800" class="text-gradient">00</div><div style="font-size:.7rem" class="muted;text-transform:uppercase;letter-spacing:.1em;margin-top:.25rem">Days</div></div>
        <div class="card-soft" style="padding:1.5rem 1.25rem;min-width:5rem"><div id="cd-hours" style="font-family:var(--font-display);font-size:2rem;font-weight:800" class="text-gradient">00</div><div style="font-size:.7rem" class="muted;text-transform:uppercase;letter-spacing:.1em;margin-top:.25rem">Hours</div></div>
        <div class="card-soft" style="padding:1.5rem 1.25rem;min-width:5rem"><div id="cd-mins" style="font-family:var(--font-display);font-size:2rem;font-weight:800" class="text-gradient">00</div><div style="font-size:.7rem" class="muted;text-transform:uppercase;letter-spacing:.1em;margin-top:.25rem">Minutes</div></div>
        <div class="card-soft" style="padding:1.5rem 1.25rem;min-width:5rem"><div id="cd-secs" style="font-family:var(--font-display);font-size:2rem;font-weight:800" class="text-gradient">00</div><div style="font-size:.7rem" class="muted;text-transform:uppercase;letter-spacing:.1em;margin-top:.25rem">Seconds</div></div>
      </div>

      <!-- Email subscribe -->
      <form data-validate data-success="Subscribed! We will notify you when we launch." style="margin-top:2.5rem" class="flex gap-2 maxw-md mx-auto">
        <input class="form-control-custom" type="email" name="email" placeholder="your@email.com" data-validate-field required style="flex:1">
        <button type="submit" class="btn btn-primary">Notify me <i class="bi bi-arrow-right"></i></button>
      </form>

      <!-- Social icons -->
      <div class="flex justify-center gap-2" style="margin-top:2.5rem">
        <a href="#" class="social-btn" style="background:var(--brand-50);color:var(--brand-600)" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
        <a href="#" class="social-btn" style="background:var(--brand-50);color:var(--brand-600)" aria-label="Twitter"><i class="bi bi-twitter-x"></i></a>
        <a href="#" class="social-btn" style="background:var(--brand-50);color:var(--brand-600)" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
        <a href="#" class="social-btn" style="background:var(--brand-50);color:var(--brand-600)" aria-label="YouTube"><i class="bi bi-youtube"></i></a>
      </div>
      <p style="margin-top:2rem;font-size:.8rem" class="muted">© <span data-year>2026</span> AquaFix Plumbing. All rights reserved.</p>
    </div>
  </div>
  <script src="js/main.js"></script>
  <script src="js/validation.js"></script>
</body>
</html>
