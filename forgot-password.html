<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1d83f5" />
  <title>Forgot Password | AquaFix Plumbing</title>
  <meta name="description" content="Reset your AquaFix account password." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-bg"></div>
    <div class="auth-card animate-fade-up">
      <div class="auth-top-actions">
        <button class="icon-btn" id="rtlToggle" aria-label="Toggle RTL" title="Toggle RTL"></button>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
      </div>
      <a href="index.html" class="navbar-brand-custom" style="text-decoration:none;color:inherit;justify-content:center;font-size:1.5rem"><span class="logo-badge"><i class="bi bi-droplet-half"></i></span><span><span class="logo-name-aqua">Aqua</span><span class="logo-name-fix">Fix</span></span></a>
      <h1 style="font-size:1.25rem;text-align:center;margin-top:.6rem">Forgot password?</h1>
      <p style="font-size:.78rem;text-align:center;margin-top:.3rem" class="muted">Enter your email and we'll send you a reset link</p>

      <form id="forgotForm" data-validate data-success="Reset link sent! Check your email." style="margin-top:.85rem">
        <div><label class="form-label-custom">Email address</label><input class="form-control-custom" type="email" name="email" placeholder="your@email.com" data-validate-field required></div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:.6rem;padding:.6rem 1.4rem;font-size:.88rem">Send reset link <i class="bi bi-arrow-right"></i></button>
      </form>

      <div id="forgotAlert" class="alert alert-success mt-3 d-none d-flex align-items-center gap-2" style="border-radius:.6rem;padding:.6rem .9rem;font-size:.82rem"><i class="bi bi-check-circle-fill"></i> <span>Reset link sent! Check your email inbox.</span></div>

      <p style="text-align:center;margin-top:.7rem;font-size:.78rem" class="muted">Remember your password? <a href="login.html" style="color:var(--brand-600);font-weight:600">Sign in</a></p>
    </div>
  </div>
  <script src="js/main.js"></script>
  <script src="js/validation.js"></script>
  <script>
    var f = document.getElementById('forgotForm');
    if (f) {
      f.addEventListener('submit', function (e) {
        e.preventDefault();
        var a = document.getElementById('forgotAlert');
        if (a) { a.classList.remove('d-none'); a.scrollIntoView({ behavior:'smooth', block:'nearest' }); }
        f.reset();
      });
    }
  </script>
</body>
</html>
