<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — AquaFix Plumbing</title>
  <meta name="description" content="Reset your AquaFix account password.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>

<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-top-bar">
          <button class="icon-btn rtl-text-btn" id="rtl-toggle" aria-label="Toggle RTL">
            RTL
          </button>
          <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode">
            <i data-lucide="moon" width="18" height="18"></i>
          </button>
        </div>

        <a href="index.html" class="auth-logo">
          <span class="logo-icon"><i data-lucide="droplet" width="24" height="24"></i></span>
          <span class="brand-name"><span class="brand-aqua">Aqua</span><span class="brand-fix">Fix</span></span>
        </a>

        <div style="text-align:center; margin-bottom:1.5rem;">
          <div
            style="width:64px; height:64px; display:grid; place-items:center; border-radius:50%; background:var(--primary-50); color:var(--primary-600); margin:0 auto 1rem;">
            <i data-lucide="key-hole" width="32" height="32"></i>
          </div>
          <h1>Forgot Password</h1>
          <p class="auth-subtitle" style="margin-bottom:0;">Enter your email and we'll send you a reset link</p>
        </div>

        <form class="auth-form" data-auth-form>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <div class="input-wrap">
              <span class="input-icon"><i data-lucide="mail" width="18" height="18"></i></span>
              <input type="email" class="form-control" placeholder="you@email.com" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary-c btn-submit">
            <i data-lucide="send" width="18" height="18"></i> Send Reset Link
          </button>
        </form>

        <div class="auth-divider">Or go back to</div>

        <div class="d-flex gap-2">
          <a href="login.html" class="btn btn-ghost-c w-100" style="justify-content:center;">
            <i data-lucide="log-in" width="18" height="18"></i> Login
          </a>
          <a href="register.html" class="btn btn-ghost-c w-100" style="justify-content:center;">
            <i data-lucide="user-plus" width="18" height="18"></i> Register
          </a>
        </div>
      </div>

      <div class="auth-back">
        <a href="index.html"><i data-lucide="arrow-left" width="16" height="16"></i> Back to home</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
      setupThemeToggle();
      setupRtlToggle();
      setupForms();
    });
  </script>
</body>

</html>
