<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — AquaFix Plumbing</title>
  <meta name="description" content="Create your AquaFix account to book plumbing services and manage appointments.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-top-bar">
          <button class="icon-btn rtl-text-btn" id="rtl-toggle" aria-label="Toggle RTL">
            RTL
          </button>
          <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode">
            <i class="bi-moon"></i>
          </button>
        </div>

        <a href="index.html" class="auth-logo">
          <span class="logo-icon"><i class="bi-droplet"></i></span>
          <span class="brand-name"><span class="brand-aqua">Aqua</span><span class="brand-fix">Fix</span></span>
        </a>

        <h1>Create Account</h1>
        <p class="auth-subtitle">Sign up to book services and track appointments</p>

        <form class="auth-form" data-auth-form>
          <div class="form-row-2">
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <div class="input-wrap">
                <span class="input-icon"><i class="bi-user"></i></span>
                <input type="text" class="form-control" placeholder="John Doe" required>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Phone</label>
              <div class="input-wrap">
                <span class="input-icon"><i class="bi-telephone"></i></span>
                <input type="tel" class="form-control" placeholder="+91 90000 12345" required>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Email Address</label>
            <div class="input-wrap">
              <span class="input-icon"><i class="bi-envelope"></i></span>
              <input type="email" class="form-control" placeholder="you@email.com" required>
            </div>
          </div>

          <div class="form-row-2">
            <div class="form-group">
              <label class="form-label">Password</label>
              <div class="input-wrap">
                <span class="input-icon"><i class="bi-lock"></i></span>
                <input type="password" id="password" class="form-control" placeholder="Create a password" required>
                <button type="button" class="toggle-pwd" data-password-toggle="password" aria-label="Toggle password visibility">
                  <i class="bi-eye"></i>
                </button>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Confirm</label>
              <div class="input-wrap">
                <span class="input-icon"><i class="bi-lock"></i></span>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required>
                <button type="button" class="toggle-pwd" data-password-toggle="confirmPassword" aria-label="Toggle password visibility">
                  <i class="bi-eye"></i>
                </button>
              </div>
            </div>
          </div>

          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="agreeTerms" required>
            <label class="form-check-label" for="agreeTerms" style="font-size:.8125rem; color:var(--text-body); font-weight:500;">
              I agree to the <a href="terms-and-conditions.html">Terms</a> and <a href="privacy-policy.html">Privacy Policy</a>
            </label>
          </div>

          <button type="submit" class="btn btn-primary-c btn-submit">
            <i class="bi-user-plus"></i> Create Account
          </button>
        </form>

        <div class="auth-divider">Or sign up with</div>

        <div class="social-buttons">
          <a href="#" class="social-btn">
            <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Google
          </a>
          <a href="#" class="social-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.95 15.84 3.83 8.1 9.32 7.64c1.32.07 2.24.7 3 .85 1.86-.37 3.34-.27 4.74.6 1.16.68 2.04 1.58 2.63 2.75-2.54 1.93-2.38 5.86.36 7.44zM12.03 7.25c-.15-2.3 1.67-4.16 3.82-4.25.29 2.58-2.34 4.5-3.82 4.25z"/></svg>
            Apple
          </a>
        </div>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Sign in</a>
        </div>
      </div>

      <div class="auth-back">
        <a href="index.html"><i class="bi-arrow-left"></i> Back to home</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setupThemeToggle();
      setupRtlToggle();
      setupPasswordToggles();
      setupForms();
    });
  </script>
</body>
</html>
