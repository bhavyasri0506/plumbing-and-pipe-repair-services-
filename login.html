<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1d83f5" />
  <title>Login | AquaFix Plumbing</title>
  <meta name="description" content="Sign in to your AquaFix account to book services, track appointments, and manage your maintenance plan." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-bg"></div>
    <div class="auth-card animate-fade-up">
      <div class="auth-top-actions">
        <button class="icon-btn" id="rtlToggle" aria-label="Toggle RTL" title="Toggle RTL"></button>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
      </div>
      <a href="index.html" class="auth-logo" aria-label="AquaFix home"><i class="bi bi-droplet-half"></i></a>
      <h1 style="font-size:1.25rem;text-align:center;margin-top:.6rem">Welcome back</h1>
      <p style="font-size:.78rem;text-align:center;margin-top:.3rem" class="muted">Sign in to your AquaFix account</p>

      <form data-validate data-success="Login successful! Redirecting..." style="margin-top:.85rem">
        <div><label class="form-label-custom">Email address</label><input class="form-control-custom" type="email" name="email" placeholder="your@email.com" data-validate-field required></div>
        <div style="margin-top:.5rem"><label class="form-label-custom">Password</label>
          <div class="pwd-wrapper"><input class="form-control-custom" type="password" name="password" placeholder="Enter password" data-validate-field required data-min-length="6"><button type="button" class="pwd-toggle" onclick="var p=this.previousElementSibling;var i=this.querySelector('i');if(p.type==='password'){p.type='text';i.className='bi bi-eye-slash';}else{p.type='password';i.className='bi bi-eye';}"><i class="bi bi-eye"></i></button></div>
        </div>
        <div class="flex items-center justify-between" style="margin-top:.5rem">
          <label class="chk-custom"><input type="checkbox" name="remember"> Remember me</label>
          <a href="#" style="font-size:.78rem;color:var(--brand-600);font-weight:600">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:.6rem;padding:.6rem 1.4rem;font-size:.88rem">Sign in <i class="bi bi-arrow-right"></i></button>
      </form>

      <div class="auth-divider">or continue with</div>
      <div class="grid-2" style="gap:.6rem">
        <button class="auth-social-btn"><i class="bi bi-google" style="color:#ea4335"></i> Google</button>
        <button class="auth-social-btn"><i class="bi bi-apple" style="font-size:1.05rem"></i> Apple</button>
      </div>

      <p style="text-align:center;margin-top:.7rem;font-size:.78rem" class="muted">Don't have an account? <a href="register.html" style="color:var(--brand-600);font-weight:600">Sign up</a></p>
    </div>
  </div>
  <script src="js/main.js"></script>
  <script src="js/validation.js"></script>
</body>
</html>
