<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Maintenance — AquaFix Plumbing</title>
  <meta name="description" content="AquaFix Plumbing website is currently under maintenance. We'll be back soon!">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/utility.css">
</head>
<body>
  <div class="maintenance-page">
    <div class="maintenance-content">
      <div class="maint-icon">
        <i data-lucide="wrench" width="50" height="50"></i>
      </div>
      <h1>Under Maintenance</h1>
      <p>We're performing some maintenance to improve your experience. Our website will be back online shortly.
        For emergencies, please call us at <strong>+91 90000 12345</strong>.</p>

      <div class="maintenance-progress">
        <div class="maintenance-progress-bar"></div>
      </div>
      <p style="font-size:.875rem; font-weight:600; color:var(--text-muted);">Estimated time: 1-2 hours</p>

      <div class="maint-social">
        <a href="#" aria-label="Facebook"><i data-lucide="facebook" width="20" height="20"></i></a>
        <a href="#" aria-label="Twitter"><i data-lucide="twitter" width="20" height="20"></i></a>
        <a href="#" aria-label="Instagram"><i data-lucide="instagram" width="20" height="20"></i></a>
        <a href="tel:+18005552782" aria-label="Call us"><i data-lucide="phone" width="20" height="20"></i></a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
