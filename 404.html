<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | AquaFix Plumbing</title>
  <meta name="description" content="The page you're looking for doesn't exist. Let's get you back on track.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/utility.css">
</head>
<body>
  <div class="error-page">
    <div class="error-content">
      <div class="error-code">404</div>
      <h1>Oops! Page Not Found</h1>
      <p>The page you're looking for seems to have gone down the drain. Don't worry — let's get you back on track.</p>

      <div class="error-actions">
        <a href="index.html" class="btn btn-primary-c btn-lg">
          <i data-lucide="home" width="20" height="20"></i> Back to Home
        </a>
        <a href="contact.html" class="btn btn-outline-c btn-lg">
          <i data-lucide="phone" width="20" height="20"></i> Contact Us
        </a>
      </div>

      <div style="margin-top:3rem;">
        <p style="font-size:.875rem; font-weight:600; margin-bottom:1rem;">Or try one of these pages:</p>
        <div class="d-flex gap-2 justify-content-center flex-wrap">
          <a href="services.html" class="btn btn-ghost-c">Services</a>
          <a href="pricing.html" class="btn btn-ghost-c">Pricing</a>
          <a href="blog.html" class="btn btn-ghost-c">Blog</a>
          <a href="about-us.html" class="btn btn-ghost-c">About</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
